<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Queue - AfriAd Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

    <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <div class="text-lg font-extrabold text-white">Afri<span style="color:#FF5A00">Ad</span> Admin</div>
            <div class="flex items-center gap-3">
                <span id="welcome-text" class="text-sm text-slate-400 hidden sm:inline">Loading...</span>
                <button onclick="logOut()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-sm font-semibold rounded-lg border border-slate-700">Log Out</button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 py-10 space-y-6">
        <div class="flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-extrabold text-white">Pending Social Proof Review</h1>
                <p class="text-sm text-slate-500">Approve moves funds from pending to withdrawable balance. Reject clears the hold — no funds are paid.</p>
            </div>
            <button onclick="loadQueue()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-sm font-semibold rounded-lg border border-slate-700">↻ Refresh</button>
        </div>

        <div id="queue" class="space-y-4">
            <p class="text-sm text-slate-500">Loading queue...</p>
        </div>
    </main>

    <script>
        const API_BASE_URL = 'https://afriad-backend.onrender.com'; // <-- replace with your real Render service URL
        let adminUser = null;

        window.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('adminToken');
            const storedUser = localStorage.getItem('adminUser');
            if (!token || !storedUser) {
                window.location.href = 'index.html';
                return;
            }
            adminUser = JSON.parse(storedUser);
            document.getElementById('welcome-text').innerText = `Signed in as ${adminUser.username}`;
            loadQueue();
        });

        function logOut() {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminUser');
            window.location.href = 'index.html';
        }

        async function authedFetch(path, options = {}) {
            const response = await fetch(`${API_BASE_URL}${path}`, {
                ...options,
                headers: {
                    ...(options.headers || {}),
                    'Authorization': 'Bearer ' + localStorage.getItem('adminToken')
                }
            });
            if (response.status === 401 || response.status === 403) {
                alert('Session expired or access denied. Please sign in again.');
                logOut();
                throw new Error('Unauthorized');
            }
            return response;
        }

        async function loadQueue() {
            const container = document.getElementById('queue');
            container.innerHTML = '<p class="text-sm text-slate-500">Loading queue...</p>';
            try {
                const response = await authedFetch('/api/admin/pending-proofs');
                const data = await response.json();
                if (!response.ok) {
                    container.innerHTML = `<p class="text-sm text-red-400">${data.error || 'Failed to load queue.'}</p>`;
                    return;
                }
                if (!data.proofs.length) {
                    container.innerHTML = '<p class="text-sm text-slate-500">Nothing pending review right now.</p>';
                    return;
                }
                container.innerHTML = data.proofs.map(renderProofCard).join('');
            } catch (err) {
                console.error(err);
            }
        }

        function renderProofCard(p) {
            const submitted = new Date(p.created_at).toLocaleString();
            return `
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div class="space-y-1">
                        <div class="font-bold text-slate-100">${p.campaign_title}</div>
                        <div class="text-sm text-slate-400">by <span class="text-slate-200">${p.earner_username}</span> · ${Number(p.earner_amount).toLocaleString()} ${p.currency} · submitted ${submitted}</div>
                        <a href="${p.proof_url}" target="_blank" rel="noopener" class="text-sm text-orange-400 hover:underline break-all">${p.proof_url}</a>
                    </div>
                    <div class="flex gap-2 shrink-0">
                        <button onclick="review(${p.id}, true, this)" class="px-4 py-2 bg-brand-green hover:bg-green-600 text-white text-sm font-bold rounded-lg" style="background-color:#00B25C">Approve</button>
                        <button onclick="review(${p.id}, false, this)" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white text-sm font-bold rounded-lg">Reject</button>
                    </div>
                </div>`;
        }

        async function review(taskId, approve, btn) {
            const card = btn.closest('div.bg-slate-900');
            btn.parentElement.querySelectorAll('button').forEach(b => b.disabled = true);
            try {
                const response = await authedFetch('/api/admin/verify-proof', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ taskId, approve })
                });
                const data = await response.json();
                if (response.ok) {
                    card.remove();
                } else {
                    alert(data.error || 'Review failed.');
                    btn.parentElement.querySelectorAll('button').forEach(b => b.disabled = false);
                }
            } catch (err) {
                console.error(err);
            }
        }
    </script>
</body>
</html>
