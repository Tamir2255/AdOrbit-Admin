<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdOrbit Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center font-sans">
    <div class="bg-slate-900 w-full max-w-sm p-8 rounded-3xl border border-slate-800 space-y-6">
        <h1 class="text-2xl font-extrabold text-white text-center">AdOrbit Admin</h1>
        <form class="space-y-4" onsubmit="handleLogin(event)">
            <input type="email" id="email" placeholder="Admin Email" required class="w-full h-12 bg-slate-800 border border-slate-700 rounded-xl px-4 text-white">
            <input type="password" id="password" placeholder="Password" required class="w-full h-12 bg-slate-800 border border-slate-700 rounded-xl px-4 text-white">
            <button type="submit" class="w-full h-12 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl">Sign In</button>
        </form>
        <p id="login-error" class="text-sm text-red-400 text-center"></p>
    </div>
    <script>
        const API_BASE_URL = 'https://afriad-central-backend.onrender.com'; // <-- replace with your real Render service URL

        async function handleLogin(event) {
            event.preventDefault();
            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value
                    })
                });
                const data = await response.json();
                if (!response.ok) { document.getElementById('login-error').innerText = data.error; return; }
                if (data.user.role !== 'admin') {
                    document.getElementById('login-error').innerText = 'This account does not have admin access.';
                    return;
                }
                localStorage.setItem('adminToken', data.token);
                window.location.href = 'dashboard.html';
            } catch (err) {
                console.error(err);
                document.getElementById('login-error').innerText = 'Connection error.';
            }
        }
    </script>
</body>
</html>
